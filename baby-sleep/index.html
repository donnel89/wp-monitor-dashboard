<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="שששש - אפליקציה להרדמת תינוקות עם רעש לבן, קול שששש, גלי ים, גשם ודופק אמא">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שששש">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap">
<title>שששש · הרדמת תינוק</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg1:#070b18; --bg2:#121a35; --bg3:#1b2246;
    --card:rgba(255,255,255,.06);
    --card-on:rgba(165,180,252,.16);
    --line:rgba(255,255,255,.10);
    --txt:#e8ecff; --mut:#9aa3c7;
    --acc:#a5b4fc; --warm:#fcd9a8;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%}
  body{
    font-family:Rubik,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,var(--bg3),var(--bg2) 45%,var(--bg1) 100%);
    color:var(--txt);min-height:100dvh;overflow-x:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6}
  #stars i{position:absolute;background:#fff;border-radius:50%;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1)}}

  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;
    padding:calc(18px + var(--safe-t)) 18px calc(26px + var(--safe-b));
    display:flex;flex-direction:column;gap:20px;min-height:100dvh}

  header{text-align:center;padding-top:6px}
  header .moon{font-size:34px;line-height:1;display:block;margin-bottom:6px;filter:drop-shadow(0 0 14px rgba(252,217,168,.45))}
  header h1{font-size:26px;font-weight:800;letter-spacing:6px}
  header p{color:var(--mut);font-size:13px;margin-top:5px}

  .label{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:10px;letter-spacing:.5px}

  .sounds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .snd{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:13px 6px 11px;text-align:center;cursor:pointer;transition:.2s;
    display:flex;flex-direction:column;align-items:center;gap:5px}
  .snd:active{transform:scale(.95)}
  .snd .e{font-size:24px;line-height:1}
  .snd .n{font-size:12px;font-weight:600;color:var(--txt)}
  .snd.on{background:var(--card-on);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 8px 26px -12px var(--acc)}
  .snd.on .n{color:var(--acc)}

  .player{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:2px}
  #playBtn{width:116px;height:116px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(160deg,#8b9cf7,#6d7ce0);color:#0a0f22;
    font-size:40px;display:grid;place-items:center;
    box-shadow:0 14px 40px -14px rgba(139,156,247,.9);transition:.2s;position:relative}
  #playBtn:active{transform:scale(.94)}
  #playBtn.playing{background:linear-gradient(160deg,#fcd9a8,#f0b978);box-shadow:0 14px 44px -12px rgba(252,217,168,.75)}
  #playBtn.playing::after{content:"";position:absolute;inset:-10px;border-radius:50%;
    border:2px solid rgba(252,217,168,.5);animation:pulse 2.6s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  #nowPlaying{font-size:14px;color:var(--mut);min-height:20px;text-align:center}
  #nowPlaying b{color:var(--warm);font-weight:700}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}

  .volrow{display:flex;align-items:center;gap:12px}
  .volrow span{font-size:18px;width:22px;text-align:center}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;
    background:linear-gradient(90deg,var(--acc) var(--pct,50%),rgba(255,255,255,.14) var(--pct,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:#fff;margin-top:-9px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:rgba(255,255,255,.14)}
  input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--acc)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border:none;border-radius:50%;background:#fff}

  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{padding:11px 4px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;transition:.18s;text-align:center}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--card-on);border-color:var(--acc);color:var(--acc)}
  #timerLeft{margin-top:12px;text-align:center;font-size:13px;color:var(--warm);min-height:18px;font-variant-numeric:tabular-nums}

  .tools{display:flex;gap:10px}
  .tool{flex:1;padding:13px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);
    color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:7px;transition:.18s}
  .tool:active{transform:scale(.96)}
  .tool.on{border-color:var(--warm);color:var(--warm)}
  .tool[hidden]{display:none}

  footer{text-align:center;color:var(--mut);font-size:11px;line-height:1.7;margin-top:auto;padding-top:8px}

  /* ---- מצב לילה ---- */
  #dim{position:fixed;inset:0;z-index:50;background:#000;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:26px;cursor:pointer}
  #dim.show{display:flex}
  #dim .dot{width:12px;height:12px;border-radius:50%;background:var(--warm);opacity:.5;
    animation:breathe 4.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(2.4);opacity:.75}}
  #dimInfo{color:#3a4160;font-size:13px;text-align:center;line-height:2}
  #dimTime{color:#4d5478;font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}

  @media (max-height:680px){
    #playBtn{width:92px;height:92px;font-size:32px}
    header h1{font-size:22px}
    .wrap{gap:14px}
  }
</style>
</head>
<body>
<div id="stars"></div>

<div class="wrap">
  <header>
    <span class="moon">🌙</span>
    <h1>שששש</h1>
    <p>צלילים מרגיעים שעוזרים לתינוק להירדם</p>
  </header>

  <section>
    <div class="label">בחרו צליל</div>
    <div class="sounds" id="sounds"></div>
  </section>

  <section class="player">
    <button id="playBtn" aria-label="נגן או עצור">▶</button>
    <div id="nowPlaying">בחרו צליל ולחצו נגן</div>
  </section>

  <section class="panel">
    <div class="volrow">
      <span>🔈</span>
      <input type="range" id="vol" min="0" max="100" value="55" aria-label="עוצמת קול">
      <span>🔊</span>
    </div>
  </section>

  <section class="panel">
    <div class="label">כיבוי אוטומטי</div>
    <div class="chips" id="timers"></div>
    <div id="timerLeft"></div>
  </section>

  <section class="tools">
    <button class="tool" id="dimBtn">🌑 מצב לילה</button>
    <button class="tool" id="lockBtn">💡 מסך דולק</button>
    <button class="tool" id="installBtn" hidden>⬇️ התקנה</button>
  </section>

  <footer>
    כל הצלילים נוצרים במכשיר — עובד גם ללא אינטרנט.<br>
    מומלץ להניח את הטלפון במרחק של כמטר מהמיטה ובעוצמה נמוכה.
  </footer>
</div>

<div id="dim">
  <div id="dimTime">00:00</div>
  <div class="dot"></div>
  <div id="dimInfo">הצליל ממשיך לנגן<br>הקישו על המסך כדי לחזור</div>
</div>

<script>
/* ================== כוכבים ברקע ================== */
(function(){
  const box=document.getElementById('stars');
  let html='';
  for(let i=0;i<38;i++){
    const s=(Math.random()*2+1).toFixed(1);
    html+=`<i style="top:${(Math.random()*100).toFixed(1)}%;right:${(Math.random()*100).toFixed(1)}%;
      width:${s}px;height:${s}px;animation-delay:${(Math.random()*4).toFixed(1)}s"></i>`;
  }
  box.innerHTML=html;
})();

/* ================== הגדרות הצלילים ================== */
const SOUNDS=[
  {id:'shush', e:'🤫', n:'שששש של אמא',      build:buildShush},
  {id:'white', e:'📻', n:'רעש לבן',   build:o=>buildFiltered(o,'white','lowpass',11000,0.7,0.85)},
  {id:'pink',  e:'🌸', n:'רעש ורוד',  build:o=>buildFiltered(o,'pink','lowpass',9000,0.7,1.0)},
  {id:'deep',  e:'🔉', n:'רעש עמוק',  build:o=>buildFiltered(o,'brown','lowpass',700,0.9,1.0)},
  {id:'rain',  e:'🌧️', n:'גשם',       build:buildRain},
  {id:'ocean', e:'🌊', n:'גלי ים',    build:buildOcean},
  {id:'womb',  e:'💗', n:'דופק אמא',  build:buildWomb},
  {id:'fan',   e:'🌀', n:'מאוורר',    build:buildFan},
  {id:'car',   e:'🚗', n:'נסיעה ברכב',build:buildCar}
];
const TIMERS=[
  {m:15,l:'15 דק׳'},{m:30,l:'30 דק׳'},{m:45,l:'45 דק׳'},
  {m:60,l:'שעה'},{m:120,l:'שעתיים'},{m:0,l:'ללא'}
];
const FADE_SEC=45;

/* ================== מנוע האודיו ================== */
let ctx=null, master=null, buffers={}, current=null;
let playing=false, currentId='shush', volume=.55, timerMin=30;
let timerEnd=0, timerTick=null;

function initCtx(){
  if(ctx) return ctx;
  const AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC();
  master=ctx.createGain();
  master.gain.value=0.0001;
  master.connect(ctx.destination);
  buffers.white=makeNoise('white');
  buffers.pink =makeNoise('pink');
  buffers.brown=makeNoise('brown');
  return ctx;
}

/* יצירת רעש בלולאה חלקה (cross-fade בקצוות) */
function makeNoise(type,seconds=6){
  const sr=ctx.sampleRate, len=Math.floor(sr*seconds), fade=Math.floor(sr*0.5);
  const raw=new Float32Array(len+fade);
  if(type==='white'){
    for(let i=0;i<raw.length;i++) raw[i]=Math.random()*2-1;
  } else if(type==='pink'){
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<raw.length;i++){
      const w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      raw[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
      b6=w*0.115926;
    }
  } else { /* brown */
    let last=0;
    for(let i=0;i<raw.length;i++){
      const w=Math.random()*2-1;
      last=(last+0.02*w)/1.02;
      raw[i]=last*3.5;
    }
  }
  const buf=ctx.createBuffer(1,len,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=raw[i];
  for(let i=0;i<fade;i++){          /* מיזוג הסוף לתוך ההתחלה = לולאה ללא קליק */
    const t=i/fade;
    d[i]=d[i]*t+raw[len+i]*(1-t);
  }
  let peak=0;
  for(let i=0;i<len;i++) peak=Math.max(peak,Math.abs(d[i]));
  if(peak>0){ const k=0.85/peak; for(let i=0;i<len;i++) d[i]*=k; }
  return buf;
}

function srcOf(name){
  const s=ctx.createBufferSource();
  s.buffer=buffers[name];
  s.loop=true;
  return s;
}
function lfo(rate,depth,param,base){
  const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=rate;
  const g=ctx.createGain(); g.gain.value=depth;
  o.connect(g); g.connect(param);
  if(base!==undefined) param.value=base;
  o.start();
  return [o,g];
}
function filt(type,freq,q){
  const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  if(q!==undefined) f.Q.value=q;
  return f;
}

/* --- בוני הצלילים: כל אחד מחזיר {nodes,timers} --- */
function buildFiltered(out,buf,type,freq,q,gain){
  const s=srcOf(buf), f=filt(type,freq,q), g=ctx.createGain();
  g.gain.value=gain;
  s.connect(f); f.connect(g); g.connect(out); s.start();
  return {nodes:[s,f,g],timers:[]};
}

function buildShush(out){
  /* שששש אנושי: רעש לבן שמעוצב לתהודת הפה של העיצור ש',
     עם מעטפת נשימה משתנה, רעד עדין ושאיפה שקטה בין הנשיפות */
  const s=srcOf('white');
  const hp=filt('highpass',1250,0.7);
  const p1=filt('peaking',2450,1.0);  p1.gain.value=12;   /* תהודת הלשון והחך */
  const p2=filt('peaking',4700,1.7);  p2.gain.value=7;    /* הברק של העיצור */
  const lp=filt('lowpass',9000,0.6);
  const trm=ctx.createGain(); trm.gain.value=1;           /* רעד הנשימה */
  const g=ctx.createGain();   g.gain.value=0.001;         /* מעטפת הנשיפה */
  const og=ctx.createGain();  og.gain.value=0.15;         /* איזון עוצמה מול שאר הצלילים */
  s.connect(hp); hp.connect(p1); p1.connect(p2); p2.connect(lp);
  lp.connect(trm); trm.connect(g); g.connect(og); og.connect(out); s.start();
  const trem=lfo(5.2,0.05,trm.gain,1);

  /* נתיב השאיפה: רעש כהה ושקט, נשמע כמו לקיחת אוויר לפני הנשיפה הבאה */
  const s2=srcOf('white');
  const ihp=filt('highpass',380);
  const ilp=filt('lowpass',1500,0.7);
  const ig=ctx.createGain(); ig.gain.value=0.001;
  s2.connect(ihp); ihp.connect(ilp); ilp.connect(ig); ig.connect(og); s2.start();

  const rnd=(a,b)=>a+Math.random()*(b-a);
  let next=ctx.currentTime+0.15;
  const tick=()=>{
    while(next<ctx.currentTime+1.6){
      const t=next;
      /* כל נשיפה מעט שונה מקודמתה - כמו אצל אדם אמיתי */
      const dur=rnd(1.15,1.55), gap=rnd(0.55,0.80);
      const amp=rnd(1.5,1.85), atk=rnd(0.16,0.24), rel=0.26;

      g.gain.setValueAtTime(0.02,t);
      g.gain.linearRampToValueAtTime(amp,t+atk);
      g.gain.linearRampToValueAtTime(amp*0.6,t+dur-rel);   /* האוויר הולך ונגמר */
      g.gain.exponentialRampToValueAtTime(0.02,t+dur);

      /* עם היחלשות האוויר הצליל מתעמעם ויורד בתדר */
      p1.frequency.setValueAtTime(rnd(2350,2600),t);
      p1.frequency.linearRampToValueAtTime(rnd(2050,2250),t+dur);
      lp.frequency.setValueAtTime(9200,t);
      lp.frequency.linearRampToValueAtTime(6800,t+dur);

      const it=t+dur+gap*0.30;
      ig.gain.setValueAtTime(0.002,it);
      ig.gain.linearRampToValueAtTime(rnd(0.10,0.16),it+gap*0.30);
      ig.gain.exponentialRampToValueAtTime(0.002,it+gap*0.62);

      next+=dur+gap;
    }
  };
  tick();
  return {nodes:[s,hp,p1,p2,lp,trm,g,og,...trem,s2,ihp,ilp,ig],timers:[setInterval(tick,400)]};
}

function buildRain(out){
  const s=srcOf('white');
  const hp=filt('highpass',800), lp=filt('lowpass',6500);
  const g=ctx.createGain(); g.gain.value=0.8;
  s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(out); s.start();
  const l=lfo(0.07,0.12,g.gain,0.78);
  const l2=lfo(0.23,900,lp.frequency,6200);
  return {nodes:[s,hp,lp,g,...l,...l2],timers:[]};
}

function buildOcean(out){
  const s=srcOf('brown');
  const lp=filt('lowpass',900,1.1);
  const g=ctx.createGain(); g.gain.value=0.6;
  s.connect(lp); lp.connect(g); g.connect(out); s.start();
  const l1=lfo(0.11,0.42,g.gain,0.58);
  const l2=lfo(0.11,520,lp.frequency,880);
  return {nodes:[s,lp,g,...l1,...l2],timers:[]};
}

function buildWomb(out){
  const s=srcOf('brown');
  const lp=filt('lowpass',480,0.8);
  const g=ctx.createGain(); g.gain.value=0.8;
  s.connect(lp); lp.connect(g); g.connect(out); s.start();
  const swish=lfo(0.9,0.16,g.gain,0.78);
  const beat=60/68;
  let next=ctx.currentTime+0.3;
  const thump=(t,amp)=>{
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(66,t);
    o.frequency.exponentialRampToValueAtTime(36,t+0.18);
    const eg=ctx.createGain();
    eg.gain.setValueAtTime(0.0001,t);
    eg.gain.exponentialRampToValueAtTime(amp,t+0.025);
    eg.gain.exponentialRampToValueAtTime(0.0001,t+0.26);
    o.connect(eg); eg.connect(out);
    o.start(t); o.stop(t+0.32);
  };
  const tick=()=>{
    while(next<ctx.currentTime+1.5){
      thump(next,0.55);
      thump(next+0.30,0.34);
      next+=beat;
    }
  };
  tick();
  return {nodes:[s,lp,g,...swish],timers:[setInterval(tick,500)]};
}

function buildFan(out){
  const s=srcOf('brown');
  const lp=filt('lowpass',1500,2.2);
  const pk=filt('peaking',190,1.4); pk.gain.value=7;
  const g=ctx.createGain(); g.gain.value=0.9;
  s.connect(lp); lp.connect(pk); pk.connect(g); g.connect(out); s.start();
  const l=lfo(3.6,0.05,g.gain,0.88);
  return {nodes:[s,lp,pk,g,...l],timers:[]};
}

function buildCar(out){
  const s=srcOf('brown');
  const lp=filt('lowpass',420,1.0);
  const g=ctx.createGain(); g.gain.value=1.0;
  s.connect(lp); lp.connect(g); g.connect(out); s.start();
  const l=lfo(0.05,0.1,g.gain,0.95);
  const l2=lfo(0.033,110,lp.frequency,430);
  return {nodes:[s,lp,g,...l,...l2],timers:[]};
}

/* --- ניהול הפעלה --- */
function disposeCurrent(){
  if(!current) return;
  current.timers.forEach(clearInterval);
  current.nodes.forEach(n=>{
    try{ if(n.stop) n.stop(); }catch(e){}
    try{ n.disconnect(); }catch(e){}
  });
  current=null;
}

function targetGain(){ return Math.max(0.0001, Math.pow(volume,1.7)); }

function startSound(id){
  initCtx();
  if(ctx.state==='suspended') ctx.resume();
  disposeCurrent();
  const def=SOUNDS.find(s=>s.id===id)||SOUNDS[0];
  current=def.build(master);
  const now=ctx.currentTime;
  master.gain.cancelScheduledValues(now);
  master.gain.setValueAtTime(Math.max(master.gain.value,0.0001),now);
  master.gain.exponentialRampToValueAtTime(targetGain(),now+1.2);
}

function stopSound(fast){
  if(!ctx||!current) { playing=false; render(); return; }
  const now=ctx.currentTime, d=fast?0.35:1.0;
  master.gain.cancelScheduledValues(now);
  master.gain.setValueAtTime(Math.max(master.gain.value,0.0001),now);
  master.gain.exponentialRampToValueAtTime(0.0001,now+d);
  setTimeout(disposeCurrent,(d+0.15)*1000);
}

function play(){
  playing=true;
  startSound(currentId);
  startTimer();
  keepAlive(true);
  updateMediaSession();
  render();
}
function pause(){
  playing=false;
  stopSound(true);
  clearTimer();
  keepAlive(false);
  updateMediaSession();
  render();
}
function toggle(){ playing?pause():play(); }

/* --- טיימר כיבוי --- */
function startTimer(){
  clearTimer();
  if(!timerMin){ document.getElementById('timerLeft').textContent='ינגן עד שתעצרו'; return; }
  timerEnd=Date.now()+timerMin*60000;
  timerTick=setInterval(()=>{
    const left=Math.max(0,timerEnd-Date.now())/1000;
    document.getElementById('timerLeft').textContent='נותרו '+fmt(left)+' דקות';
    if(left<=FADE_SEC && ctx && current && !master.__fading){
      master.__fading=true;
      const now=ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(master.gain.value,0.0001),now);
      master.gain.exponentialRampToValueAtTime(0.0001,now+Math.max(left,1));
    }
    if(left<=0){ master.__fading=false; pause(); document.getElementById('timerLeft').textContent='הסתיים 🌙'; }
  },500);
}
function clearTimer(){
  if(timerTick) clearInterval(timerTick);
  timerTick=null;
  if(master) master.__fading=false;
  if(!playing) document.getElementById('timerLeft').textContent='';
}
function fmt(sec){
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return m+':'+String(s).padStart(2,'0');
}

  }
  if(on){ keeper.play().catch(()=>{}); } else { keeper.pause(); }
}
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const def=SOUNDS.find(s=>s.id===currentId);
  navigator.mediaSession.metadata=new MediaMetadata({
    title:def?def.n:'שששש',
    artist:'שששש · הרדמת תינוק',
    artwork:[{src:'icons/icon-192.png',sizes:'192x192',type:'image/png'},
             {src:'icons/icon-512.png',sizes:'512x512',type:'image/png'}]
  });
  navigator.mediaSession.playbackState=playing?'playing':'paused';
  try{
    navigator.mediaSession.setActionHandler('play',()=>{ if(!playing) play(); });
    navigator.mediaSession.setActionHandler('pause',()=>{ if(playing) pause(); });
    navigator.mediaSession.setActionHandler('stop',()=>{ if(playing) pause(); });
  }catch(e){}
}

/* ================== ממשק ================== */
function render(){
  document.querySelectorAll('.snd').forEach(el=>el.classList.toggle('on',el.dataset.id===currentId));
  const btn=document.getElementById('playBtn');
  btn.textContent=playing?'❚❚':'▶';
  btn.classList.toggle('playing',playing);
  const def=SOUNDS.find(s=>s.id===currentId);
  document.getElementById('nowPlaying').innerHTML=
    playing? 'מנגן עכשיו · <b>'+def.n+'</b>' : 'נבחר: <b>'+def.n+'</b> — לחצו נגן';
  document.querySelectorAll('#timers .chip').forEach(el=>el.classList.toggle('on',+el.dataset.m===timerMin));
  const v=document.getElementById('vol');
  v.style.setProperty('--pct',Math.round(volume*100)+'%');
}

(function buildUI(){
  document.getElementById('sounds').innerHTML=SOUNDS.map(s=>
    `<div class="snd" data-id="${s.id}"><div class="e">${s.e}</div><div class="n">${s.n}</div></div>`).join('');
  document.getElementById('timers').innerHTML=TIMERS.map(t=>
    `<button class="chip" data-m="${t.m}">${t.l}</button>`).join('');

  document.getElementById('sounds').addEventListener('click',e=>{
    const el=e.target.closest('.snd'); if(!el) return;
    currentId=el.dataset.id;
    save();
    if(playing){ startSound(currentId); updateMediaSession(); }
    render();
  });
  document.getElementById('timers').addEventListener('click',e=>{
    const el=e.target.closest('.chip'); if(!el) return;
    timerMin=+el.dataset.m;
    save();
    if(playing) startTimer(); else document.getElementById('timerLeft').textContent='';
    render();
  });
  document.getElementById('playBtn').addEventListener('click',toggle);

  const vol=document.getElementById('vol');
  vol.addEventListener('input',()=>{
    volume=vol.value/100;
    if(ctx&&current&&!master.__fading){
      const now=ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(master.gain.value,0.0001),now);
      master.gain.exponentialRampToValueAtTime(targetGain(),now+0.25);
    }
    vol.style.setProperty('--pct',vol.value+'%');
    save();
  });

  /* מצב לילה */
  const dim=document.getElementById('dim');
  document.getElementById('dimBtn').addEventListener('click',async()=>{
    if(!playing) play();
    dim.classList.add('show');
    await requestLock();
    tickClock();
  });
  dim.addEventListener('click',()=>dim.classList.remove('show'));
  function tickClock(){
    const d=new Date();
    document.getElementById('dimTime').textContent=
      String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  setInterval(tickClock,10000); tickClock();

  /* מסך דולק */
  document.getElementById('lockBtn').addEventListener('click',()=>{
    wakeLock? releaseLock() : requestLock();
  });
})();

/* --- Wake Lock --- */
let wakeLock=null;
async function requestLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{ wakeLock=null; lockUI(); });
    }
  }catch(e){}
  lockUI();
}
async function releaseLock(){
  try{ if(wakeLock) await wakeLock.release(); }catch(e){}
  wakeLock=null; lockUI();
}
function lockUI(){ document.getElementById('lockBtn').classList.toggle('on',!!wakeLock); }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(playing && ctx && ctx.state==='suspended') ctx.resume();
    if(!wakeLock && document.getElementById('lockBtn').classList.contains('on')) requestLock();
  }
});

/* --- שמירת העדפות --- */
function save(){
  try{ localStorage.setItem('shush',JSON.stringify({currentId,volume,timerMin})); }catch(e){}
}
(function load(){
  try{
    const s=JSON.parse(localStorage.getItem('shush')||'{}');
    if(s.currentId && SOUNDS.some(x=>x.id===s.currentId)) currentId=s.currentId;
    if(typeof s.volume==='number') volume=s.volume;
    if(typeof s.timerMin==='number') timerMin=s.timerMin;
  }catch(e){}
  document.getElementById('vol').value=Math.round(volume*100);
  render();
})();

/* --- PWA --- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=document.getElementById('installBtn');
  b.hidden=false;
  b.onclick=async()=>{ b.hidden=true; deferredPrompt.prompt(); deferredPrompt=null; };
});
